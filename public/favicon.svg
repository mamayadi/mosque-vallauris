<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1a472a"/>
  <!-- Mosque silhouette in gold -->
  <g fill="#c9a84c">
    <!-- Far left minaret -->
    <rect x="1" y="9" width="4" height="22" rx="0.5"/>
    <polygon points="1,9 3,4 5,9"/>
    <!-- Far right minaret -->
    <rect x="27" y="9" width="4" height="22" rx="0.5"/>
    <polygon points="27,9 29,4 31,9"/>
    <!-- Building base -->
    <rect x="6" y="18" width="20" height="13" rx="1"/>
    <!-- Main dome -->
